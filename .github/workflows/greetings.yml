name: Greetings

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  issues: write
  pull-requests: write

jobs:
  greet:
    name: Welcome First-Time Contributors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            👋 Thanks for opening your first issue! A maintainer will take a look soon.
            Make sure you've filled out the template completely — it helps us help you faster.
          pr-message: >
            🎉 Thanks for your first pull request! A maintainer will review it shortly.
            Remember to add a label matching your change type (see CONTRIBUTING.md).
