name: Release Drafter

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  draft:
    name: Update Draft Release
    runs-on: ubuntu-latest
    steps:
      # Release Drafter reads merged PR titles and labels to build release notes.
      # It also suggests the next version number based on PR labels.
      # View and edit the draft at: GitHub → Releases → (Draft)
      - uses: release-drafter/release-drafter@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
