name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 1 * * *" # runs daily at 01:00 UTC

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark and Close Stale Items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          stale-issue-message: >
            This issue has been inactive for 60 days and has been marked as stale.
            It will be closed in 14 days if there is no new activity.
            Feel free to comment if this is still relevant!
          stale-pr-message: >
            This pull request has been inactive for 30 days and has been marked as stale.
            It will be closed in 14 days if there is no new activity.
            Please rebase and update if you'd like to continue.
          close-issue-message: Closed due to 74 days of inactivity. Reopen if still relevant.
          close-pr-message: Closed due to 44 days of inactivity. Reopen if you'd like to continue.
          days-before-issue-stale: 60
          days-before-pr-stale: 30
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: "pinned,security"
          exempt-pr-labels: "pinned,security"
